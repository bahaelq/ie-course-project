[project]
name = "ie-course"
version = "0.1.0"
description = "Information Extraction in Python — Course Materials"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # NLP core
    "spacy>=3.7",
    "nltk>=3.8",
    # ML / Deep Learning
    "torch>=2.2",
    "transformers>=4.40,<5",
    # Structured output & parsing
    "pypdf>=4.2",
    "python-docx>=1.1",
    "lxml>=5",
    # LLM-based extraction
    "python-dotenv>=1.0",
    # Notebooks & visualization
    "jupyter>=1.0",
    "rich>=13.7",
    "streamlit>=1.39",
    # spacy models
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.metadata]
allow-direct-references = true
